# Local development database. Production uses a managed Postgres via DATABASE_URL.
services:
  postgres:
    image: postgres:17-alpine
    container_name: aabshar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aabshar
      POSTGRES_PASSWORD: aabshar_dev
      POSTGRES_DB: aabshar
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - aabshar-pg:/var/lib/postgresql/data

volumes:
  aabshar-pg:
